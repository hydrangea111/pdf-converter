<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPG → PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0ede8;
    --card: #faf8f5;
    --ink: #1c1917;
    --ink2: #78716c;
    --accent: #d97706;
    --accent2: #fef3c7;
    --border: #e7e5e0;
    --danger: #dc2626;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Gowun Dodum', serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px 80px;
  }

  .wrap {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 4px 0 8px;
    border-bottom: 2px solid var(--ink);
  }

  header h1 {
    font-family: 'DM Mono', monospace;
    font-size: 20px;
    letter-spacing: -0.5px;
  }

  header span {
    font-size: 12px;
    color: var(--ink2);
    font-family: 'DM Mono', monospace;
  }

  /* drop zone */
  #drop-zone {
    background: var(--card);
    border: 1.5px dashed #c4bfb9;
    border-radius: 12px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    user-select: none;
  }
  #drop-zone.dragover {
    border-color: var(--accent);
    background: var(--accent2);
  }

  #drop-zone .icon {
    font-size: 32px;
    margin-bottom: 10px;
    display: block;
  }

  #drop-zone p {
    font-size: 14px;
    color: var(--ink2);
    line-height: 1.6;
  }

  #drop-zone strong { color: var(--ink); }

  /* preview grid */
  #preview {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .thumb-wrap {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--border);
    cursor: grab;
    aspect-ratio: 3/4;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    transition: box-shadow .15s;
  }
  .thumb-wrap:active { cursor: grabbing; box-shadow: 0 4px 12px rgba(0,0,0,.15); }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  .thumb-num {
    position: absolute;
    bottom: 4px;
    right: 5px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    background: rgba(0,0,0,.55);
    color: #fff;
    border-radius: 4px;
    padding: 1px 4px;
    pointer-events: none;
  }

  .thumb-del {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    background: rgba(220,38,38,.8);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 12px;
    line-height: 20px;
    text-align: center;
    cursor: pointer;
    display: none;
    padding: 0;
  }
  .thumb-wrap:hover .thumb-del { display: block; }

  /* controls */
  .controls {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .field label {
    display: block;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--ink2);
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: var(--accent); }

  .row { display: flex; gap: 8px; }

  .btn {
    flex: 1;
    padding: 10px 8px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    font-family: 'Gowun Dodum', serif;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    transition: background .12s, border-color .12s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg); border-color: #a8a29e; }
  .btn:active { background: #e7e5e0; }

  .btn-primary {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
    font-size: 14px;
    padding: 12px;
  }
  .btn-primary:hover { background: #44403c; border-color: #44403c; }
  .btn-primary:disabled { background: #c4bfb9; border-color: #c4bfb9; cursor: not-allowed; }

  /* progress */
  #prog-wrap {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }

  #prog-label {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--ink2);
    margin-bottom: 8px;
  }

  .bar-bg {
    height: 5px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  #bar { height: 100%; width: 0%; background: var(--accent); border-radius: 99px; transition: width .18s ease; }

  /* count badge */
  #count-badge {
    display: none;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--ink2);
    text-align: right;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>JPG → PDF</h1>
    <span id="count-badge">파일 0개</span>
  </header>

  <div id="drop-zone">
    <span class="icon">📂</span>
    <p><strong>클릭하거나 여기에 파일을 드래그</strong><br>JPG, PNG, WEBP 등 이미지 파일</p>
    <input type="file" id="file-input" multiple accept="image/*" style="display:none">
  </div>

  <div id="preview"></div>

  <div class="controls">
    <div class="field">
      <label>저장 파일명</label>
      <input type="text" id="fname" placeholder="파일명 (기본: converted)">
    </div>
    <div class="row">
      <button class="btn" onclick="sortFiles(1)">가나다순 ↑</button>
      <button class="btn" onclick="sortFiles(-1)">가나다순 ↓</button>
      <button class="btn" onclick="clearAll()">전체 삭제</button>
    </div>
    <button class="btn btn-primary" id="dl-btn" disabled onclick="makePDF()">PDF 저장</button>
  </div>

  <div id="prog-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div id="prog-label" style="font-family:'DM Mono',monospace;font-size:12px;color:var(--ink2)">준비 중…</div>
      <div id="prog-pct" style="font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--accent)">0%</div>
    </div>
    <div class="bar-bg"><div id="bar"></div></div>
  </div>

</div>

<script>
const { jsPDF } = window.jspdf;

// 파일 목록: { file, objectURL } 순서는 DOM 순서로 관리
const files = []; // { id, file, objURL }
let uidCounter = 0;

const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');
const preview    = document.getElementById('preview');
const dlBtn      = document.getElementById('dl-btn');
const progWrap   = document.getElementById('prog-wrap');
const progLabel  = document.getElementById('prog-label');
const bar        = document.getElementById('bar');
const badge      = document.getElementById('count-badge');

// ── 드래그 & 드롭 ─────────────────────────────────
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => addFiles(e.target.files));

// ── 파일 추가 (ObjectURL → 썸네일, RAM 절약) ──────
function addFiles(list) {
  for (const f of list) {
    if (!f.type.startsWith('image/')) continue;
    const id  = uidCounter++;
    const url = URL.createObjectURL(f);           // 메모리 효율적
    files.push({ id, file: f, objURL: url });

    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';
    wrap.dataset.id = id;

    const img = document.createElement('img');
    img.src = url;
    img.loading = 'lazy';
    img.decoding = 'async';

    const num = document.createElement('div');
    num.className = 'thumb-num';

    const del = document.createElement('button');
    del.className = 'thumb-del';
    del.textContent = '✕';
    del.addEventListener('click', (e) => { e.stopPropagation(); removeFile(id, wrap); });

    wrap.append(img, num, del);
    preview.appendChild(wrap);
  }
  updateUI();
  fileInput.value = '';   // 동일 파일 재선택 허용
}

// ── 개별 삭제 ────────────────────────────────────
function removeFile(id, el) {
  const idx = files.findIndex(f => f.id === id);
  if (idx !== -1) {
    URL.revokeObjectURL(files[idx].objURL);       // 즉시 메모리 해제
    files.splice(idx, 1);
  }
  el.remove();
  updateUI();
}

// ── 전체 삭제 ────────────────────────────────────
function clearAll() {
  files.forEach(f => URL.revokeObjectURL(f.objURL));
  files.length = 0;
  preview.innerHTML = '';
  updateUI();
  progWrap.style.display = 'none';
}

// ── 가나다순 정렬 (dir: 1=오름차순, -1=내림차순) ──
function sortFiles(dir = 1) {
  const domItems = [...preview.children];
  domItems.sort((a, b) => {
    const fa = files.find(f => f.id == a.dataset.id).file.name;
    const fb = files.find(f => f.id == b.dataset.id).file.name;
    return fa.localeCompare(fb, 'ko', { numeric: true }) * dir;
  });
  domItems.forEach(el => preview.appendChild(el));
  updateUI();
}

// ── UI 상태 업데이트 (순번 갱신) ────────────────
function updateUI() {
  const count = preview.children.length;
  dlBtn.disabled = count === 0;
  badge.style.display = count ? 'block' : 'none';
  badge.textContent = `파일 ${count}개`;
  [...preview.children].forEach((el, i) => {
    el.querySelector('.thumb-num').textContent = i + 1;
  });
}

// ── Sortable (드래그 순서 변경) ──────────────────
Sortable.create(preview, {
  animation: 140,
  ghostClass: 'sortable-ghost',
  onEnd: updateUI,
});

// ── PDF 생성 (메모리 최소화) ──────────────────────
async function makePDF() {
  const items = [...preview.querySelectorAll('.thumb-wrap')];
  if (!items.length) return;

  const rawName = document.getElementById('fname').value.trim() || 'converted';
  const safeName = rawName.replace(/[:\\/*?"<>|]/g, '_');

  dlBtn.disabled = true;
  progWrap.style.display = 'block';

  const pdf = new jsPDF('p', 'mm', 'a4');
  const PW = pdf.internal.pageSize.getWidth();
  const PH = pdf.internal.pageSize.getHeight();

  for (let i = 0; i < items.length; i++) {
    setProgress(i, items.length);
    if (i > 0) pdf.addPage();

    const id   = Number(items[i].dataset.id);
    const entry = files.find(f => f.id === id);
    if (!entry) continue;

    await new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        // 최대 해상도 2048px 제한 (속도 ↑, 품질은 충분)
        const MAX = 2048;
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > MAX || h > MAX) {
          const s = MAX / Math.max(w, h);
          w = Math.round(w * s); h = Math.round(h * s);
        }

        // OffscreenCanvas 지원 시 메인 스레드 부하 감소
        let canvas, ctx;
        try {
          canvas = new OffscreenCanvas(w, h);
          ctx = canvas.getContext('2d');
        } catch {
          canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          ctx = canvas.getContext('2d');
        }

        ctx.drawImage(img, 0, 0, w, h);

        // OffscreenCanvas → Blob → dataURL 변환
        const toDataURL = (cvs) => new Promise(res => {
          if (cvs instanceof OffscreenCanvas) {
            cvs.convertToBlob({ type: 'image/jpeg', quality: 0.88 })
               .then(blob => {
                 const fr = new FileReader();
                 fr.onload = () => res(fr.result);
                 fr.readAsDataURL(blob);
               });
          } else {
            res(cvs.toDataURL('image/jpeg', 0.88));
          }
        });

        toDataURL(canvas).then(dataURL => {
          const ratio = Math.min(PW / w, PH / h);
          const dx = (PW - w * ratio) / 2;
          const dy = (PH - h * ratio) / 2;
          pdf.addImage(dataURL, 'JPEG', dx, dy, w * ratio, h * ratio, '', 'FAST');
          resolve();
        });
      };
      img.src = entry.objURL;   // ObjectURL 재사용 (재독 없음)
    });
  }

  setProgress(items.length, items.length);
  progLabel.textContent = '✓ 저장 완료';
  document.getElementById('prog-pct').textContent = '100%';
  pdf.save(`${safeName}.pdf`);
  dlBtn.disabled = false;
}

function setProgress(cur, total) {
  const pct = Math.round((cur / total) * 100);
  bar.style.width = pct + '%';
  document.getElementById('prog-pct').textContent = pct + '%';
  progLabel.textContent = cur < total
    ? `PDF 생성 중 ${cur + 1} / ${total}`
    : '저장 중…';
}
</script>
</body>
</html>
